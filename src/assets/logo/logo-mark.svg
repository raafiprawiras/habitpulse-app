<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hp-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="hp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16A34A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield/Heart Container -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#hp-brand-grad)" filter="url(#hp-glow)"/>

  <!-- Abstract Heart Outline & ECG Pulse Wave ending in Upward Arrow -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart Background Curve Accent -->
    <path d="M 50 80 C 24 64 16 46 25 31 C 32 19 44 22 50 30 C 56 22 68 19 75 31 C 84 46 76 64 50 80 Z" 
          stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

    <!-- Active Pulse Wave with Upward Progress Arrow -->
    <path d="M 18 50 L 32 50 L 39 34 L 47 66 L 56 24 L 64 56 L 70 44 L 74 48 M 68 44 L 75 44 L 75 51" 
          stroke="#FFFFFF" stroke-width="6.5"/>
  </g>
</svg>
